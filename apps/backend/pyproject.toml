[project]
name = "shelf-stock-backend"
version = "0.1.0"
description = "Backend for shelf stock monitoring system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "apscheduler>=3.11,<4.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28,<1.0",
    "loguru>=0.7,<1.0",
    "numpy>=2.0,<3.0",
    "opencv-python-headless>=4.10,<6.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
